<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100" fill="none">
  <!-- Background with subtle gold glow -->
  <rect width="300" height="100" rx="8" fill="white" stroke="#ff9900" stroke-width="1"/>
  
  <!-- Image Placeholder (Left) - Attractive -->
  <rect x="10" y="10" width="80" height="80" rx="4" fill="#ffeebd"/>
  <text x="50" y="55" font-family="sans-serif" font-size="20" fill="#ffa000" text-anchor="middle">📷</text>
  
  <!-- Title (Bold) -->
  <rect x="100" y="15" width="120" height="12" rx="2" fill="#333"/>
  
  <!-- Stars (High rating) -->
  <g transform="translate(100, 35)">
    <text x="0" y="10" font-family="Arial" font-size="12" fill="#ff9900">★★★★★</text> 
    <text x="60" y="10" font-family="sans-serif" font-size="10" fill="#666" font-weight="bold">4.9 (1,240 reviews)</text>
  </g>
  
  <!-- "Must Eat" Badge -->
  <rect x="100" y="52" width="50" height="14" rx="2" fill="#fff0f0"/>
  <text x="125" y="62" font-family="sans-serif" font-size="8" fill="#ff2442" text-anchor="middle" font-weight="bold">MUST VISIT</text>
  
  <!-- Ranking -->
  <text x="160" y="62" font-family="sans-serif" font-size="9" fill="#ff9900" font-weight="bold">Top 1 in Area</text>

  <!-- Location -->
  <rect x="100" y="75" width="100" height="8" rx="2" fill="#f5f5f5"/>

  <!-- Price -->
  <text x="280" y="50" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">₩₩</text>
</svg>
