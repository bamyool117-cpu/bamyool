<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100" fill="none">
  <!-- Background -->
  <rect width="300" height="100" rx="8" fill="white" stroke="#e0e0e0"/>
  
  <!-- Image Placeholder (Left) -->
  <rect x="10" y="10" width="80" height="80" rx="4" fill="#f0f0f0"/>
  <text x="50" y="55" font-family="sans-serif" font-size="10" fill="#999" text-anchor="middle">No Image</text>
  
  <!-- Title -->
  <rect x="100" y="15" width="140" height="12" rx="2" fill="#e0e0e0"/>
  
  <!-- Stars (Low rating) -->
  <g transform="translate(100, 35)">
    <text x="0" y="10" font-family="Arial" font-size="12" fill="#ff9900">★★★☆☆</text> 
    <text x="60" y="10" font-family="sans-serif" font-size="10" fill="#999">3.0 (2 reviews)</text>
  </g>
  
  <!-- Location/Category (Generic) -->
  <rect x="100" y="55" width="80" height="8" rx="2" fill="#f5f5f5"/>
  <rect x="100" y="70" width="60" height="8" rx="2" fill="#f5f5f5"/>
  
  <!-- Price -->
  <text x="250" y="50" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">₩₩₩</text>
</svg>
